[package]
name = "locaryn-plugin-voice-tts"
version = "2.2.0-beta.2"
edition = "2021"
description = "Official Locaryn Extension: Text-to-Speech (TTS) & Voice Cloning (Kokoro, Qwen3-TTS, Piper)"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "locaryn-voice-tts-mcp"
path = "src/bin/voice_tts_mcp.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[workspace]
